# Phase 3 test database: H2 in PostgreSQL compatibility mode.
# V1__baseline.sql must run unchanged here AND on PostgreSQL.
spring.datasource.url=jdbc:h2:mem:artisanalbrew;MODE=PostgreSQL;DATABASE_TO_LOWER=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# EF table/column names are case-sensitive and explicitly quoted on every
# entity: Spring Boot's snake-case physical strategy would rewrite them
# (it ignores quoting), so the pass-through strategy is required.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration-h2
logging.level.org.flywaydb=WARN
